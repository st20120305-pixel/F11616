<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX FOCUS F1 戰術讀書系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0A0D14] text-slate-100 font-sans selection:bg-red-600 selection:text-white min-h-screen flex flex-col">
  <!-- 頂部遙測數據列 -->
  <header class="border-b border-slate-800 bg-[#0F131C] px-4 py-3 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-red-600 text-white font-black italic px-2.5 py-1 rounded transform -skew-x-12 shadow-lg">
          APEX
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-wide uppercase font-mono">
            APEX FOCUS <span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.5 rounded">F1 戰術版</span>
          </h1>
        </div>
      </div>
      <div class="flex items-center space-x-3 font-mono text-xs">
        <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-amber-400 font-bold" id="lapDisplay">
          0 Laps
        </div>
        <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-emerald-400 font-bold" id="hpDisplay">
          785 HP
        </div>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">
    <!-- 計時器卡片 -->
    <div class="bg-gradient-to-b from-[#0F131D] to-[#080B12] border border-slate-800 rounded-2xl p-6 text-center shadow-2xl">
      <div class="text-xs font-mono text-slate-400 uppercase tracking-widest mb-2" id="modeTitle">Sprint Stint (單圈衝刺 25M)</div>
      <div class="text-7xl md:text-8xl font-black font-mono tracking-tighter text-white my-6" id="timerText">
        25:00
      </div>
      
      <div class="flex justify-center items-center space-x-4 mt-6">
        <button id="startBtn" onclick="toggleTimer()" class="px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-mono font-black text-sm rounded-2xl shadow-xl shadow-red-600/30 transition">
          PUSH NOW (啟動衝刺)
        </button>
        <button onclick="resetTimer()" class="p-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl transition border border-slate-700">
          🔄
        </button>
      </div>
    </div>

    <!-- 快速操作與任務 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-[#0F131D] border border-slate-800 rounded-2xl p-5">
        <h3 class="text-xs font-mono font-bold text-slate-400 uppercase mb-3">🏁 手動回報專注圈數</h3>
        <p class="text-xs text-slate-500 mb-4">每完成一個專注時段，點擊下方按鈕增加 1 圈紀錄：</p>
        <button onclick="addLap()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-mono font-bold text-xs rounded-xl transition shadow-lg">
          +1 圈專注完成 (Complete Lap)
        </button>
      </div>

      <div class="bg-[#0F131D] border border-slate-800 rounded-2xl p-5">
        <h3 class="text-xs font-mono font-bold text-slate-400 uppercase mb-3">⚡ 已裝備動力單元 (PU)</h3>
        <div class="space-y-2 text-xs font-mono">
          <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between">
            <span class="text-white font-bold">MGU-K 動能回收</span>
            <span class="text-emerald-400">+100 HP</span>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between">
            <span class="text-white font-bold">DRS 減阻系統</span>
            <span class="text-emerald-400">+85 HP</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-900 bg-[#07090F] py-4 text-center text-xs font-mono text-slate-600">
    APEX FOCUS TELEMETRY SYSTEM • MOBILE OPTIMIZED
  </footer>

  <script>
    // 讀取本地儲存
    let laps = parseInt(localStorage.getItem('apex_laps')) || 0;
    document.getElementById('lapDisplay').innerText = laps + ' Laps';

    function addLap() {
      laps += 1;
      localStorage.setItem('apex_laps', laps);
      document.getElementById('lapDisplay').innerText = laps + ' Laps';
      alert('🏎️ P1! 成功完成一圈專注！');
    }

    // 簡易計時器邏輯
    let timerRunning = false;
    let timeLeft = 25 * 60;
    let timerInterval = null;

    function toggleTimer() {
      const btn = document.getElementById('startBtn');
      if (!timerRunning) {
        timerRunning = true;
        btn.innerText = "BOX / PAUSE (暫停)";
        btn.className = "px-8 py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-mono font-black text-sm rounded-2xl shadow-xl transition";
        
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            laps += 1;
            localStorage.setItem('apex_laps', laps);
            document.getElementById('lapDisplay').innerText = laps + ' Laps';
            alert('🏁 衝刺完成！自動增加 1 圈！');
            resetTimer();
          }
        }, 1000);
      } else {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.innerText = "PUSH NOW (啟動衝刺)";
        btn.className = "px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-mono font-black text-sm rounded-2xl shadow-xl shadow-red-600/30 transition";
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timeLeft = 25 * 60;
      updateTimerDisplay();
      document.getElementById('startBtn').innerText = "PUSH NOW (啟動衝刺)";
      document.getElementById('startBtn').className = "px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-mono font-black text-sm rounded-2xl shadow-xl shadow-red-600/30 transition";
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerText').innerText = `${m}:${s}`;
    }
  </script>
</body>
</html>
